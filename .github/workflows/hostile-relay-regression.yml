name: Hostile relay regression
on:
  push:
    branches:
      - research/zero-context-transport-provenance-20261106
  pull_request:
    paths:
      - 'docs/rendered-reality/research/continuity-computing/transport_provenance/**'
      - '.github/workflows/hostile-relay-regression.yml'
  workflow_dispatch:
jobs:
  provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Run unified 20-test suite
        working-directory: docs/rendered-reality/research/continuity-computing/transport_provenance
        run: python -m unittest discover -s . -p 'test_*.py' -v
